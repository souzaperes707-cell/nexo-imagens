name: teste-vozes
on:
  push:
    branches: [teste-vozes]
    paths: ['scripts/qwen.py','scripts/chatter.py','scripts/falas.py','.github/workflows/teste-vozes.yml']
permissions:
  contents: write
jobs:
  qwen:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq sox libsox-dev ffmpeg
      - run: pip install -q torch torchaudio --index-url https://download.pytorch.org/whl/cpu && pip install -q qwen-tts soundfile
      - run: python scripts/qwen.py
      - uses: actions/upload-artifact@v4
        with: {name: qwen, path: saida3/qwen}
  chatterbox:
    needs: qwen
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -q git+https://github.com/resemble-ai/chatterbox.git
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with: {name: qwen, path: saida3/qwen}
      - run: python scripts/chatter.py
      - uses: actions/upload-artifact@v4
        with: {name: chatterbox, path: saida3/chatterbox}
  salvar:
    needs: [qwen, chatterbox]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with: {path: saida3}
      - run: |
          git config user.name "teste-vozes"; git config user.email "actions@github.com"
          git add saida3 && git commit -m "resultado teste de vozes [skip ci]" && git push || echo nada
